name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The page claims it sends nothing anywhere. That claim is only worth making
      # while it is enforced, so a subresource pointing off-origin fails the build.
      - name: Refuse off-origin subresources
        run: |
          if grep -nE '<(script|img)[^>]+src="https?://|<link[^>]+href="https?://' web/index.html; then
            echo "::error::An off-origin subresource would break the no-third-party-requests claim."
            exit 1
          fi
          echo "No off-origin subresources in index.html."

      - name: Refuse remote fonts and analytics in the shell
        run: |
          if grep -nEi 'fonts\.googleapis|fonts\.gstatic|googletagmanager|google-analytics|cdn\.|unpkg|jsdelivr' web/app.css web/app.js; then
            echo "::error::A CDN or analytics reference found in the site shell."
            exit 1
          fi
          echo "Site shell is self-contained."

      # The page makes two kinds of outbound call, and both are visible in the source:
      # reading an addon manifest, and the three Stremio calls the shortcut needs. A
      # second, quieter channel would make the page weaker than its own copy claims, so
      # those channels fail the build.
      - name: Refuse hidden request channels
        run: |
          if grep -nEi 'XMLHttpRequest|sendBeacon|new WebSocket|EventSource|importScripts|<iframe|serviceWorker|eval\(' web/app.js web/index.html; then
            echo "::error::A hidden request or eval channel found in the site shell."
            exit 1
          fi
          echo "No hidden request channels."

      # Stremio's own API is the only off-origin endpoint the page may post to.
      - name: Pin the API endpoint to Stremio's
        run: |
          test "$(grep -c 'https://api.strem.io/api' web/app.js)" -eq 1 || {
            echo "::error::Expected exactly one api.strem.io reference, in STREMIO_API."
            exit 1
          }
          grep -qF 'const STREMIO_API = "https://api.strem.io/api";' web/app.js || {
            echo "::error::STREMIO_API is not the expected Stremio endpoint."
            exit 1
          }
          echo "The only API endpoint is Stremio's."

      - name: Confirm the committed assets are present
        run: |
          for file in web/assets/penguplay-qr.png \
                      web/assets/fonts/plex.css \
                      web/assets/fonts/plex-arabic-400.woff2 \
                      web/assets/fonts/plex-arabic-700.woff2; do
            test -s "$file" || { echo "::error::Missing or empty: $file"; exit 1; }
          done
          echo "Assets present."

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
